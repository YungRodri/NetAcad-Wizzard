<!DOCTYPE html>
<html>
<head>
  <title>NetAcad Scraper Control</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 320px;
      padding: 10px;
      background-color: #f4f7f6;
    }
    h3 {
      color: #0056b3;
      text-align: center;
      margin-top: 5px;
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-top: 10px;
      color: #333;
    }
    input[type="text"], input[type="password"], select {
      width: calc(100% - 22px);
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: content-box;
    }
    select {
      width: 100%;
      box-sizing: border-box;
    }
    .toggle-row {
      margin: 9px 0 0 0;
      display: flex;
      align-items: center;
    }
    .toggle-row input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }
    .toggle-row label {
      margin-top: 0;
      cursor: pointer;
      font-size: 13px;
    }
    button {
      background-color: #007bff;
      color: white;
      padding: 10px 15px;
      margin-top: 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
      font-weight: 600;
    }
    button:hover {
      background-color: #0056b3;
    }
    #processPage {
      background-color: #28a745;
      margin-top: 8px;
    }
    #processPage:hover {
      background-color: #218838;
    }
    #status {
      margin-top: 10px;
      text-align: center;
      font-size: 0.9em;
      color: #555;
    }
  </style>
</head>
<body>
  <h3>NetAcad AI Assistant</h3>

  <label for="apiKey">Gemini API Key:</label>
  <input type="password" id="apiKey" placeholder="Enter your Gemini API Key">

  <label for="geminiModel">Gemini Model:</label>
  <select id="geminiModel">
    <option value="gemini-3.5-flash-lite" selected>gemini-3.5-flash-lite (Recomendado y activo)</option>
    <option value="gemini-3.8-flash">gemini-3.8-flash</option>
    <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
    <option value="gemini-3.5-flash">gemini-3.5-flash</option>
  </select>

  <div class="toggle-row">
    <input type="checkbox" id="showAnswersToggle" checked>
    <label for="showAnswersToggle">Show AI Answers (Mostrar sugerencias)</label>
  </div>

  <div class="toggle-row">
    <input type="checkbox" id="autoSelectToggle" checked>
    <label for="autoSelectToggle" style="color: #0056b3; font-weight: bold;">Auto-select Answers (Auto-marcar respuestas)</label>
  </div>

  <div class="toggle-row">
    <input type="checkbox" id="stealthModeToggle">
    <label for="stealthModeToggle" style="color: #6f42c1; font-weight: bold;">Modo Sigilo (Sin recuadro ni colores)</label>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="processOnSwitchToggle" checked>
    <label for="processOnSwitchToggle">Process on Page Switch (Auto-detectar preguntas)</label>
  </div>

  <div class="toggle-row">
    <input type="checkbox" id="autoAdvanceToggle">
    <label for="autoAdvanceToggle">Auto-advance Next (Pasar a la siguiente)</label>
  </div>

  <button id="saveKey">Save Settings</button>
  <button id="processPage">Process Questions on this Page</button>

  <div id="status"></div>
  <small style="display:block; text-align:center; margin-top:8px; color:#777;">Atajo: Alt + Shift + Q</small>

  <script src="popup.js"></script>
</body>
</html>
